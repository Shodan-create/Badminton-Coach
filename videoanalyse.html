<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badminton Coach - Footwork & Split-Step Analytics</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-bottom: 5px;
      color: #58a6ff;
    }

    .subtitle {
      color: #8b949e;
      margin-bottom: 20px;
    }

    .controls {
      margin-bottom: 20px;
    }

    input[type="file"] {
      background: #161b22;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      cursor: pointer;
    }

    .video-container {
      position: relative;
      max-width: 90vw;
      max-height: 65vh;
      display: flex;
      justify-content: center;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }

    video {
      max-width: 100%;
      max-height: 65vh;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Dashboard Styles */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      width: 90vw;
      max-width: 900px;
      margin-top: 20px;
    }

    .metric-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .metric-card h3 {
      margin: 0 0 10px 0;
      font-size: 0.9rem;
      color: #8b949e;
      text-transform: uppercase;
    }

    .metric-value {
      font-size: 1.4rem;
      font-weight: bold;
      color: #58a6ff;
    }

    .status-active { color: #2f81f7 !important; }
    .status-good { color: #3fb950 !important; }
    .status-warn { color: #d29922 !important; }
  </style>
</head>
<body>

  <h1>Badminton Footwork Analytics</h1>
  <div class="subtitle">Automatische Split-Step- & Beinarbeits-Analyse</div>
  
  <div class="controls">
    <input type="file" id="videoUpload" accept="video/*" />
  </div>

  <div class="video-container">
    <video id="inputVideo" controls></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="dashboard">
    <div class="metric-card">
      <h3>Split-Step Status</h3>
      <div id="splitStepStatus" class="metric-value">Bereit...</div>
    </div>
    <div class="metric-card">
      <h3>Standbreite (Füße/Schulter)</h3>
      <div id="stanceWidthValue" class="metric-value">0.0x</div>
    </div>
    <div class="metric-card">
      <h3>Antritts-Geschwindigkeit</h3>
      <div id="moveSpeedValue" class="metric-value">0 px/f</div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('inputVideo');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const fileInput = document.getElementById('videoUpload');

    // Dashboard Elements
    const splitStepStatus = document.getElementById('splitStepStatus');
    const stanceWidthValue = document.getElementById('stanceWidthValue');
    const moveSpeedValue = document.getElementById('moveSpeedValue');

    // Tracking Hilfsvariablen
    let previousHipY = null;
    let previousAnkleX = null;

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults((results) => {
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const landmarks = results.poseLandmarks;

        // Custom Styling: Unterkörper hervorgehoben (Neon-Gelb)
        drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, { color: '#00f2fe', lineWidth: 2 });
        drawLandmarks(canvasCtx, landmarks, { color: '#ffe600', lineWidth: 1, radius: 4 });

        // Wichtige Punkte für Beinarbeit
        const leftShoulder = landmarks[11];
        const rightShoulder = landmarks[12];
        const leftHip = landmarks[23];
        const rightHip = landmarks[24];
        const leftAnkle = landmarks[27];
        const rightAnkle = landmarks[28];

        // Sichtbarkeitsprüfung
        if (leftHip.visibility > 0.5 && rightHip.visibility > 0.5 && 
            leftAnkle.visibility > 0.5 && rightAnkle.visibility > 0.5) {

          // 1. STANDBREITE (Verhältnis Fußabstand zu Schulterabstand)
          const shoulderWidth = Math.abs(rightShoulder.x - leftShoulder.x);
          const ankleWidth = Math.abs(rightAnkle.x - leftAnkle.x);
          
          const stanceRatio = shoulderWidth > 0 ? (ankleWidth / shoulderWidth).toFixed(2) : 0;
          
          stanceWidthValue.innerText = `${stanceRatio}x Schulterbreite`;
          if (stanceRatio >= 1.2 && stanceRatio <= 1.8) {
            stanceWidthValue.className = 'metric-value status-good';
          } else if (stanceRatio < 1.0) {
            stanceWidthValue.className = 'metric-value status-warn';
          } else {
            stanceWidthValue.className = 'metric-value';
          }

          // 2. SPLIT-STEP ERKENNUNG (Hüft-Dip / Schwerpunkt-Absenkung)
          const currentHipY = (leftHip.y + rightHip.y) / 2;

          if (previousHipY !== null) {
            const hipVelocityY = currentHipY - previousHipY; // Positiv = Abwärtsbewegung (Dip)

            // Schnelles Absenken der Hüfte signalisiert den Split-Step Landing Dip
            if (hipVelocityY > 0.012 && stanceRatio >= 1.1) {
              splitStepStatus.innerText = '⚡ SPLIT-STEP DETEKTIERT';
              splitStepStatus.className = 'metric-value status-good';
            } else if (hipVelocityY < -0.012) {
              splitStepStatus.innerText = '🚀 Abdruck / Sprung';
              splitStepStatus.className = 'metric-value status-active';
            } else {
              splitStepStatus.innerText = 'In Bewegung / Neutral';
              splitStepStatus.className = 'metric-value';
            }
          }
          previousHipY = currentHipY;

          // 3. ANTRITTS-GESCHWINDIGKEIT / FOOTWORK VELOCITY
          const currentAnkleX = (leftAnkle.x + rightAnkle.x) / 2;
          if (previousAnkleX !== null) {
            const lateralDisplacement = Math.abs(currentAnkleX - previousAnkleX) * canvasElement.width;
            const lateralSpeed = Math.round(lateralDisplacement);

            moveSpeedValue.innerText = `${lateralSpeed} px/frame`;
            if (lateralSpeed > 12) {
              moveSpeedValue.className = 'metric-value status-good';
            } else {
              moveSpeedValue.className = 'metric-value';
            }
          }
          previousAnkleX = currentAnkleX;

          // Visualisierungs-Linie für Standbreite direkt am Boden zeichnen
          const leftAnkleX = leftAnkle.x * canvasElement.width;
          const leftAnkleY = leftAnkle.y * canvasElement.height;
          const rightAnkleX = rightAnkle.x * canvasElement.width;
          const rightAnkleY = rightAnkle.y * canvasElement.height;

          canvasCtx.beginPath();
          canvasCtx.moveTo(leftAnkleX, leftAnkleY);
          canvasCtx.lineTo(rightAnkleX, rightAnkleY);
          canvasCtx.strokeStyle = (stanceRatio >= 1.2 && stanceRatio <= 1.8) ? '#3fb950' : '#d29922';
          canvasCtx.lineWidth = 4;
          canvasCtx.stroke();
        }
      }
      canvasCtx.restore();
    });

    async function processFrame() {
      if (!videoElement.paused && !videoElement.ended) {
        await pose.send({ image: videoElement });
        requestAnimationFrame(processFrame);
      }
    }

    videoElement.addEventListener('play', () => {
      processFrame();
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        videoElement.src = url;
        videoElement.load();
        previousHipY = null;
        previousAnkleX = null;
      }
    });
  </script>
</body>
</html>
