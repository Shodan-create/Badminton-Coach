<script>
  const videoElement = document.getElementById('inputVideo');
  const canvasElement = document.getElementById('outputCanvas');
  const canvasCtx = canvasElement.getContext('2d');
  const fileInput = document.getElementById('videoUpload');

  const hitStatus = document.getElementById('hitStatus');
  const splitStatus = document.getElementById('splitStatus');

  let lastWristY = null;
  let lastWristSpeed = 0;
  let hitActiveFrames = 0;
  let playerReceiverHipY = null;
  let splitDetectedInWindow = false;

  // MediaPipe Pose mit hoher Präzision für kleine/entfernte Personen
  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 2, // 2 = Höchste Präzision für entfernte Personen auf dem Feld
    smoothLandmarks: true,
    minDetectionConfidence: 0.2, // Niedrigerer Schwellenwert, damit kleine Figuren erkannt werden
    minTrackingConfidence: 0.2
  });

  pose.onResults((results) => {
    // Canvas exakt auf die gerenderte Videogröße skalieren
    if (videoElement.videoWidth && videoElement.videoHeight) {
      canvasElement.width = videoElement.clientWidth;
      canvasElement.height = videoElement.clientHeight;
    }

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (results.poseLandmarks) {
      const landmarks = results.poseLandmarks;

      // Skelett & Punkte zeichnen
      drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, { color: '#00f2fe', lineWidth: 2 });
      drawLandmarks(canvasCtx, landmarks, { color: '#ff0844', lineWidth: 1, radius: 3 });

      // 1. SCHLAGEINGANG (Schläger-Hand)
      const wrist = landmarks[16];
      const shoulder = landmarks[12];

      if (wrist && shoulder && wrist.visibility > 0.2) {
        const currentWristY = wrist.y;

        if (lastWristY !== null) {
          const wristSpeedY = (lastWristY - currentWristY);

          if (wrist.y < shoulder.y && wristSpeedY > 0.015) {
            hitActiveFrames = 10;
            splitDetectedInWindow = false;
          }
        }
        lastWristY = currentWristY;
      }

      // 2. ROTER KONTAKTPUNKT
      if (hitActiveFrames > 0) {
        hitActiveFrames--;

        const wristX = wrist.x * canvasElement.width;
        const wristY = wrist.y * canvasElement.height;

        canvasCtx.beginPath();
        canvasCtx.arc(wristX, wristY, 20, 0, 2 * Math.PI);
        canvasCtx.fillStyle = 'rgba(255, 0, 0, 0.85)';
        canvasCtx.fill();
        canvasCtx.strokeStyle = '#FFFFFF';
        canvasCtx.lineWidth = 2;
        canvasCtx.stroke();

        hitStatus.innerText = '💥 SCHLAG ERFOLGT (ROT)';
        hitStatus.className = 'metric-value status-late';

        // 3. SPLIT-STEP MONITORING
        const leftHip = landmarks[23];
        const rightHip = landmarks[24];

        if (leftHip && rightHip) {
          const currentHipY = (leftHip.y + rightHip.y) / 2;

          if (playerReceiverHipY !== null) {
            const hipDip = currentHipY - playerReceiverHipY;
            if (hipDip > 0.005) {
              splitDetectedInWindow = true;
            }
          }
          playerReceiverHipY = currentHipY;
        }

        if (splitDetectedInWindow) {
          splitStatus.innerText = '🎯 PERFEKT! Split-Step erkannt';
          splitStatus.className = 'metric-value status-perfect';
        } else {
          splitStatus.innerText = '⚠️ Kein Split-Step während Schlag';
          splitStatus.className = 'metric-value status-early';
        }

      } else {
        hitStatus.innerText = 'Warte auf nächsten Schlag...';
        hitStatus.className = 'metric-value';
      }
    }
    canvasCtx.restore();
  });

  // Kontinuierliche Analyse-Schleife
  async function processFrame() {
    if (!videoElement.paused && !videoElement.ended) {
      await pose.send({ image: videoElement });
      requestAnimationFrame(processFrame);
    }
  }

  videoElement.addEventListener('play', () => {
    processFrame();
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      videoElement.src = url;
      videoElement.load();
      hitActiveFrames = 0;
      lastWristY = null;
      playerReceiverHipY = null;
    }
  });
</script>
