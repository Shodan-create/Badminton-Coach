<script>
  const videoElement = document.getElementById('inputVideo');
  const canvasElement = document.getElementById('outputCanvas');
  const canvasCtx = canvasElement.getContext('2d');
  const fileInput = document.getElementById('videoUpload');

  const hitStatus = document.getElementById('hitStatus');
  const splitStatus = document.getElementById('splitStatus');

  let hitActiveFrames = 0;
  let lastWristY = null;
  let prevReceiverHipY = null;

  // MediaPipe Pose Instanz
  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.15, // Sehr sensibel für weit entfernte Spieler
    minTrackingConfidence: 0.15
  });

  pose.onResults((results) => {
    canvasElement.width = videoElement.clientWidth;
    canvasElement.height = videoElement.clientHeight;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (results.poseLandmarks) {
      const landmarks = results.poseLandmarks;

      // Draw Visual Skeleton
      drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, { color: '#00f2fe', lineWidth: 2 });
      drawLandmarks(canvasCtx, landmarks, { color: '#ff0844', lineWidth: 1, radius: 3 });

      // 1. SCHLAG-DETEKTION (Hand/Racket oben & Peitschenbewegung)
      const wrist = landmarks[16];
      const shoulder = landmarks[12];
      const hip = landmarks[24];

      if (wrist && shoulder && wrist.visibility > 0.2) {
        if (lastWristY !== null) {
          const speedY = lastWristY - wrist.y;
          // Wenn die Hand weit oben ist und sich schlagartig bewegt
          if (wrist.y < shoulder.y && speedY > 0.012) {
            hitActiveFrames = 15; // Schlag-Marker für ca. 0.5s aktivieren
          }
        }
        lastWristY = wrist.y;
      }

      // 2. SPLIT-STEP MONITORING (Hüft-Dip des Empfängers)
      if (hip && hip.visibility > 0.2) {
        if (prevReceiverHipY !== null) {
          const dip = hip.y - prevReceiverHipY;
          
          if (hitActiveFrames > 0) {
            // Roter Punkt am Kontaktpunkt
            const wX = wrist.x * canvasElement.width;
            const wY = wrist.y * canvasElement.height;

            canvasCtx.beginPath();
            canvasCtx.arc(wX, wY - 20, 18, 0, 2 * Math.PI);
            canvasCtx.fillStyle = '#ff0000';
            canvasCtx.fill();
            canvasCtx.strokeStyle = '#ffffff';
            canvasCtx.lineWidth = 2;
            canvasCtx.stroke();

            hitStatus.innerText = '💥 KONTAKTPUNKT (ROT)';
            hitStatus.className = 'metric-value status-late';

            if (dip > 0.004) {
              splitStatus.innerText = '🎯 PERFEKT! Split-Step erkannt';
              splitStatus.className = 'metric-value status-perfect';
            }
          }
        }
        prevReceiverHipY = hip.y;
      }

      if (hitActiveFrames > 0) {
        hitActiveFrames--;
      } else {
        hitStatus.innerText = 'Warte auf Schlag...';
        hitStatus.className = 'metric-value';
      }
    }
    canvasCtx.restore();
  });

  async function processFrame() {
    if (!videoElement.paused && !videoElement.ended) {
      await pose.send({ image: videoElement });
      requestAnimationFrame(processFrame);
    }
  }

  videoElement.addEventListener('play', () => {
    processFrame();
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      videoElement.src = URL.createObjectURL(file);
      videoElement.load();
      hitActiveFrames = 0;
      lastWristY = null;
      prevReceiverHipY = null;
    }
  });
</script>
