<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badminton Footwork Rhythm Analytics</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 { margin-bottom: 5px; color: #58a6ff; }
    .subtitle { color: #8b949e; margin-bottom: 20px; }

    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
    }

    select, input[type="file"] {
      background: #161b22;
      color: #fff;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #30363d;
      cursor: pointer;
    }

    .video-container {
      position: relative;
      max-width: 90vw;
      max-height: 55vh;
      display: flex;
      justify-content: center;
      border: 1px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
    }

    video { max-width: 100%; max-height: 55vh; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      width: 90vw;
      max-width: 800px;
      margin-top: 20px;
    }

    .metric-card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }

    .metric-card h3 { margin: 0 0 10px 0; font-size: 0.85rem; color: #8b949e; text-transform: uppercase; }
    .metric-value { font-size: 1.4rem; font-weight: bold; color: #58a6ff; }
    .status-good { color: #3fb950 !important; }
    .status-warn { color: #d29922 !important; }
  </style>
</head>
<body>

  <h1>Footwork Rhythm Analyzer</h1>
  <div class="subtitle">Analyse der Bewegungsgleichmäßigkeit (Benchmark: Momota / LCW)</div>
  
  <div class="controls">
    <input type="file" id="videoUpload" accept="video/*" />
    <select id="proModel">
      <option value="lcw">Vorbild: Lee Chong Wei (Rechtshänder - Explosiv)</option>
      <option value="momota">Vorbild: Kento Momota 2018 (Linkshänder - Kontrolliert/Flüssig)</option>
    </select>
  </div>

  <div class="video-container">
    <video id="inputVideo" controls></video>
    <canvas id="outputCanvas"></canvas>
  </div>

  <div class="dashboard">
    <div class="metric-card">
      <h3>Flüssigkeit / Rhythmus</h3>
      <div id="rhythmScore" class="metric-value">0%</div>
    </div>
    <div class="metric-card">
      <h3>Schritt-Frequenz</h3>
      <div id="cadenceValue" class="metric-value">0 Schritte/Min</div>
    </div>
    <div class="metric-card">
      <h3>Bewegungs-Flow</h3>
      <div id="flowStatus" class="metric-value">Starte Video...</div>
    </div>
  </div>

  <script>
    const videoElement = document.getElementById('inputVideo');
    const canvasElement = document.getElementById('outputCanvas');
    const canvasCtx = canvasElement.getContext('2d');
    const fileInput = document.getElementById('videoUpload');

    const rhythmScore = document.getElementById('rhythmScore');
    const cadenceValue = document.getElementById('cadenceValue');
    const flowStatus = document.getElementById('flowStatus');

    let historySpeeds = [];
    let stepTimestamps = [];
    let prevAnklePos = null;
    let isStepPeak = false;

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.3,
      minTrackingConfidence: 0.3
    });

    pose.onResults((results) => {
      canvasElement.width = videoElement.clientWidth;
      canvasElement.height = videoElement.clientHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const landmarks = results.poseLandmarks;

        drawConnectors(canvasCtx, landmarks, POSE_CONNECTIONS, { color: '#00f2fe', lineWidth: 2 });
        drawLandmarks(canvasCtx, landmarks, { color: '#ffe600', lineWidth: 1, radius: 4 });

        const leftAnkle = landmarks[27];
        const rightAnkle = landmarks[28];

        if (leftAnkle && rightAnkle && (leftAnkle.visibility > 0.3 || rightAnkle.visibility > 0.3)) {
          const currentAnkleX = ((leftAnkle.x + rightAnkle.x) / 2) * canvasElement.width;
          const currentAnkleY = ((leftAnkle.y + rightAnkle.y) / 2) * canvasElement.height;

          if (prevAnklePos !== null) {
            const dx = currentAnkleX - prevAnklePos.x;
            const dy = currentAnkleY - prevAnklePos.y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            // Stand-Zittern herausfiltern
            if (dist < 3.0) {
              dist = 0;
            }

            historySpeeds.push(dist);
            if (historySpeeds.length > 30) historySpeeds.shift();

            // Schritte registrieren
            if (dist > 6.0 && !isStepPeak) {
              isStepPeak = true;
              stepTimestamps.push(videoElement.currentTime);
            } else if (dist < 3.5) {
              isStepPeak = false;
            }

            const now = videoElement.currentTime;
            stepTimestamps = stepTimestamps.filter(t => (now - t) <= 3.0);
            
            const stepsPerMin = Math.round((stepTimestamps.length / 3.0) * 60);
            cadenceValue.innerText = `${stepsPerMin} Schritte/Min`;

            // Rhythmus-Score
            const nonZeroSpeeds = historySpeeds.filter(s => s > 0);
            
            if (nonZeroSpeeds.length < 5) {
              rhythmScore.innerText = '0%';
              rhythmScore.className = 'metric-value status-warn';
              flowStatus.innerText = '🛑 Stillstand / Keine Schritte';
              flowStatus.className = 'metric-value status-warn';
            } else {
              const avgSpeed = nonZeroSpeeds.reduce((a, b) => a + b, 0) / nonZeroSpeeds.length;

              let variance = 0;
              nonZeroSpeeds.forEach(s => {
                variance += Math.abs(s - avgSpeed);
              });
              const jerkFactor = variance / nonZeroSpeeds.length;

              let score = Math.round(100 - (jerkFactor * 4.5));
              if (score > 92) score = 88;
              if (score < 15) score = 15;

              rhythmScore.innerText = `${score}%`;

              if (score >= 75) {
                rhythmScore.className = 'metric-value status-good';
                flowStatus.innerText = '✨ Flüssiger Pro-Flow';
                flowStatus.className = 'metric-value status-good';
              } else if (score >= 50) {
                rhythmScore.className = 'metric-value';
                flowStatus.innerText = '⚖️ Variable Schrittfolge';
                flowStatus.className = 'metric-value';
              } else {
                rhythmScore.className = 'metric-value status-warn';
                flowStatus.innerText = '⚠️ Unruhig / Abgehackt';
                flowStatus.className = 'metric-value status-warn';
              }
            }

            // Graph zeichnen
            canvasCtx.beginPath();
            canvasCtx.strokeStyle = '#3fb950';
            canvasCtx.lineWidth = 2;

            const graphW = 150;
            const graphH = 40;
            const startX = canvasElement.width - graphW - 15;
            const startY = 15;

            canvasCtx.fillStyle = 'rgba(13, 17, 23, 0.85)';
            canvasCtx.fillRect(startX - 5, startY - 5, graphW + 10, graphH + 10);

            historySpeeds.forEach((spd, i) => {
              const x = startX + (i * (graphW / 30));
              const y = startY + graphH - Math.min(graphH, spd * 2);
              if (i === 0) canvasCtx.moveTo(x, y);
              else canvasCtx.lineTo(x, y);
            });
            canvasCtx.stroke();
          }

          prevAnklePos = { x: currentAnkleX, y: currentAnkleY };
        }
      }
      canvasCtx.restore();
    });

    async function processFrame() {
      if (!videoElement.paused && !videoElement.ended) {
        await pose.send({ image: videoElement });
        requestAnimationFrame(processFrame);
      }
    }

    videoElement.addEventListener('play', () => processFrame());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        videoElement.src = URL.createObjectURL(file);
        videoElement.load();
        historySpeeds = [];
        stepTimestamps = [];
        prevAnklePos = null;
      }
    });
  </script>
</body>
</html>
